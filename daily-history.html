<!doctype html>
<html lang="lo"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PromoFlow · ປະຫວັດລາຍວັນ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#087348;--mint:#e8f8f0;--paper:#faf9f4;--ink:#14231e;--muted:#67736e;--line:#dbe8e2;--red:#c73535}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Lao',sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.back{border:0;border-radius:10px;padding:10px 14px;background:var(--mint);color:var(--green);font:inherit;font-weight:800;cursor:pointer}.hero{margin:14px 0 18px;padding:22px;background:linear-gradient(120deg,#087348,#15965e);color:#fff;border-radius:18px}.hero h1{margin:0;font-size:25px}.hero p{margin:4px 0 0;color:#dff3e9}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar p{margin:0;color:var(--muted)}input{border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:#fff}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover,.card:focus{transform:translateY(-2px);box-shadow:0 8px 20px #14312518;outline:2px solid #58cba2}.card h2{margin:0 0 6px;font-size:17px}.card p{margin:4px 0;color:var(--muted);font-size:13px}.pill{display:inline-block;margin:7px 3px 0 0;padding:4px 8px;border-radius:99px;background:var(--mint);color:var(--green);font-weight:800;font-size:11px}.open{display:block;margin-top:12px;color:var(--green);font-size:12px;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}.overlay{display:none;position:fixed;inset:0;background:#0d282080;z-index:10;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 55px #071a14aa}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.modal h2{margin:0}.modal p{color:var(--muted)}button{font:inherit;font-weight:800;cursor:pointer}.close,.delete{border:0;border-radius:9px;padding:9px 12px}.close{background:#eff5f2}.delete{margin-top:12px;background:#fff0f0;color:var(--red)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}.online{margin-top:14px;padding:12px;background:#f2fbf7;border-radius:10px}.online h3{margin:0 0 7px}.online p{margin:5px 0;color:var(--ink)}
    @media(max-width:720px){.wrap{padding:12px}.hero{padding:18px}.hero h1{font-size:21px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%;min-height:44px;font-size:16px}.list{grid-template-columns:1fr}.card{padding:14px}.overlay{padding:0;align-items:flex-end}.modal{max-height:92vh;border-radius:18px 18px 0 0;padding:16px}th,td{font-size:12px;padding:7px 4px}}
  </style>
<script src="branch-context.js"></script>
</head><body>
  <main class="wrap"><button class="back" onclick="location.href='../index.html'">← ກັບຄືນ PromoFlow</button><section class="hero"><h1>🗂️ ປະຫວັດລາຍວັນ</h1><p>ເບິ່ງ ແລະຄົ້ນຫາບັນທຶກລາຍວັນ</p></section><div class="toolbar"><p id="status">ກຳລັງໂຫຼດ…</p><input id="dateFilter" type="date" aria-label="ຄົ້ນຫາຕາມວັນທີ"></div><section id="list" class="list"></section></main>
  <div id="overlay" class="overlay" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>ລາຍລະອຽດປະຫວັດລາຍວັນ</h2><p id="meta"></p></div><button id="close" class="close">✕ ປິດ</button></div><div id="details"></div></section></div>
  <script>
    const client=supabase.createClient('https://sytvktwgaxokwripenvd.supabase.co','sb_publishable_XILath1IrxTxXfgYMjztbQ_821NXG_j');
    let userId=null,isAdmin=false,records=[];
    const $=id=>document.getElementById(id),escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const num=v=>{const n=Number(String(v??0).replace(/[, ]+/g,''));return Number.isFinite(n)?n.toLocaleString():escapeHtml(v)};
    const labels=[['cash_open','CASH IN(ເປີດ)'],['credit_in4','CREDIT IN 1'],['credit_in5','CREDIT IN 2'],['credit_in7','CREDIT IN 3'],['credit_in8','CREDIT IN 4'],['credit_in9','CREDIT IN 5'],['credit_in6','ເຕີມ-ຖອນ(ເຄດິດ)'],['total1','Total1'],['cash_close','CASH OUT(ປິດ)'],['credit_out3','CREDIT OUT 1'],['credit_out4','CREDIT OUT 2'],['credit_out5','CREDIT OUT 3'],['credit_out6','CREDIT OUT 4'],['credit_out7','CREDIT OUT 5'],['credit_out8','ເຕີມ-ຖອນ(ເງິນ)'],['promo','ໂປໂມຊັນ'],['expense','ລາຍຈ່າຍ'],['THB','ບາດ 1'],['THB2','ບາດ 2'],['cash4','cash kip'],['kip','kip'],['cash5','cash kip2'],['kip2','kip2'],['cash6','cash kip3'],['kip3','kip3'],['cash_count','ເງິນສົດ'],['bill','ບິນ'],['totalExpenses','TotalExpenses'],['grand_total','Grand Total']];
    const values=r=>({...((r?.report_data?.values)||{}),...((r?.report_data?.computed)||{})});
    function render(){const day=$('dateFilter').value,list=records.filter(r=>!day||r.report_date===day);$('status').textContent=day?`ຜົນຄົ້ນຫາ ${list.length} ບັນທຶກ`:`ທັງໝົດ ${list.length} ບັນທຶກ`;$('list').innerHTML=list.length?list.map((r,i)=>{const v=values(r);return `<article class="card" role="button" tabindex="0" data-id="${r.id}"><h2>ບັນທຶກລາຍວັນ #${String(i+1).padStart(2,'0')}</h2><p>📅 ${escapeHtml(new Date(r.captured_at).toLocaleString())}</p><p>👤 ພະນັກງານ: <b>${escapeHtml(r.staff_name||'')}</b></p><span class="pill">ໂປໂມຊັນ: ${num(v.promo)}</span><span class="pill">ລາຍຈ່າຍ: ${num(v.expense)}</span><span class="pill">kip2: ${num(v.kip2)}</span><span class="pill">ບາດ 1: ${num(v.THB)}</span><span class="pill">Grand Total: ${num(v.grand_total)}</span><span class="open">ຄິກເບິ່ງລາຍລະອຽດ →</span></article>`}).join(''):'<div class="empty">ບໍ່ພົບປະຫວັດລາຍວັນ</div>'}
    function openDetail(id){const r=records.find(x=>x.id===id);if(!r)return;const v=values(r),online=Array.isArray(r.online_expenses?.rows)?r.online_expenses.rows:[];$('meta').textContent=`📅 ${new Date(r.captured_at).toLocaleString()} · 👤 ${r.staff_name||''}`;$('details').innerHTML=`<table><thead><tr><th>ລາຍການ</th><th>ຈຳນວນ</th></tr></thead><tbody>${labels.map(([key,label])=>`<tr><td class="label" ${r.report_data?.labels?.[key]?'data-no-translate':''}>${escapeHtml(r.report_data?.labels?.[key]||label)}</td><td>${num(v[key])}</td></tr>`).join('')}</tbody></table><div class="online"><h3>ລາຍຈ່າຍ (ONLINE)</h3>${online.length?online.map((x,i)=>`<p>${i+1}. ${escapeHtml(x.date||'')} · ${escapeHtml(x.remark||'')} · <b>${num(x.amount)}</b></p>`).join(''):'<p>ບໍ່ມີລາຍຈ່າຍ ONLINE</p>'}</div>${isAdmin?`<button class="delete" data-delete="${r.id}">🗑️ ລຶບບັນທຶກນີ້</button>`:''}`;$('overlay').classList.add('show');$('overlay').setAttribute('aria-hidden','false')}
    async function removeRecord(id){if(!isAdmin||!confirm('ຢືນຢັນລຶບບັນທຶກນີ້? ກູ້ຄືນບໍ່ໄດ້.'))return;const {error}=await client.from('finance_daily_history').delete().eq('id',id);if(error){alert('ລຶບບໍ່ສຳເລັດ: '+error.message);return;}$('overlay').classList.remove('show');await load();}
    let dailyBranchId;
    async function load(){const {data,error}=await client.from('finance_daily_history').select('*').eq('branch_id',dailyBranchId).order('captured_at',{ascending:false}).limit(500);if(error){$('status').textContent='ບໍ່ສາມາດໂຫຼດໄດ້';$('list').innerHTML='<div class="empty">ກະລຸນາ Run SQL ສຳລັບປະຫວັດລາຍວັນກ່ອນ</div>';return;}records=data||[];render()}
    async function start(){let {data:{session}}=await client.auth.getSession();if(!session){await new Promise(r=>setTimeout(r,650));({data:{session}}=await client.auth.getSession());}if(!session){location.replace('../index.html');return;}userId=session.user.id;const {data}=await client.from('profiles').select('role,branch_id,active').eq('id',userId).maybeSingle();isAdmin=String(data?.role||'').trim().toLowerCase()==='admin';dailyBranchId=await resolveFinanceBranch(client,data);await load()}
    $('dateFilter').addEventListener('input',render);$('list').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openDetail(c.dataset.id)});$('list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id]')){e.preventDefault();openDetail(e.target.dataset.id)}});$('close').onclick=()=>{$('overlay').classList.remove('show');$('overlay').setAttribute('aria-hidden','true')};$('overlay').onclick=e=>{if(e.target===$('overlay')){$('overlay').classList.remove('show');$('overlay').setAttribute('aria-hidden','true')}};$('details').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(b)removeRecord(b.dataset.delete)});start().catch(e=>{$('status').textContent='ເກີດຂໍ້ຜິດພາດ';console.error(e)});
  </script>
<script src="page-menu.js"></script><script src="../language.js"></script><script src="complete-menu.js"></script></body></html>
